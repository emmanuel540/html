<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>HTML FORMS</h1>
    <form>
        <fieldset>
           <legend>Personal Details</legend> 
           <input type="text" placeholder="Enter your name"><br><br>
           <input type="number" placeholder="Enter your ID"><br><br>
           <input type="email" placeholder="Enter your email"><br><br>
            <input type="password" placeholder="Enter your password"><br><br>
        </fieldset>
        <br>
        <fieldset>
            <label for="">Your Interest</label><br>
            <input type="checkbox"> Football <br>
            <input type="checkbox"> Volleyball <br>
            <input type="checkbox"> Basketball <br>
            <input type="checkbox"> Handball <br>
            <input type="checkbox"> Hockey <br>

            <label for="">Your Gender </label><br>
            <input type="radio" name="gender"> Male <br>
            <input type="radio" name="gender"> Female <br>
            <input type="radio" name="gender"> Others <br>

            <label for="">Choose your picture</label>
            <input type="file"><br>

            <label for="">Select your date of birth</label>
            <input type="date"><br>

            <label for="">Choose your course</label>
            <select name="" id="">
                <option value="">Computer Science</option>
                <option value="">Engineering Course</option>
                <option value="">Business Development</option>
                <option value="">Law</option>
                <option value="">Economics</option>
            </select>
        </fieldset>
        <br>
        <fieldset>
            <label for="">Leave your comment</label><br>
            <textarea name="" id=""></textarea>
        </fieldset>
        <br>
        <input type="submit" value="Submit Your Application">
        <input type="reset">
    </form>
</body>
</html>
