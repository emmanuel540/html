<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Driving License Application</h1>
    <fieldset>
        <legend>Personal Information</legend>
        <label for="">Full Name:</label><br>
        <input type="text"><br><br>
        <label for="">Date of Birth</label><br>
        <input type="date"><br><br>
        <label for="">Gender</label><br>
        <input type="radio">Male <br>
        <input type="radio">Female <br>
        <input type="radio">Other <br><br>
        <label for="">Contact Number:</label><br>
        <input type="text"><br><br>
        <label for="">Email Address:</label><br>
        <input type="text"><br><br>
        <label for="">Address:</label><br>
        <textarea name="" id=""></textarea>
    </fieldset>
    <br><br>

    <fieldset>
        <legend>Driving History</legend>
        <label for="">Type of License:</label>
        <select name="" id="">
            <option value="">Learner's Permit</option>
            <option value="">Full License</option>
            <option value="">Commercial License</option>
        </select><br><br>
        <label for="">Previous Licenses Held:</label><br>
        <textarea name="" id=""></textarea><br><br>
        <label for="">Accidents or Violations(if any):</label><br>
        <textarea name="" id=""></textarea>
    </fieldset>
    <br><br>
    <fieldset>
        <legend>Required Documents</legend><br>
        <label for="">Upload ID Proof:</label><br>
        <input type="file"><br><br>
        <label for="">Upload Address Proof:</label><br>
        <input type="file"><br><br>
        <label for="">Upload Recent Photo:</label><br>
        <input type="file"><br><br>
        <label for="">Upload Medical Certificate:</label><br>
        <input type="file">
    </fieldset>
    <br>
    <input type="submit" value="Submit Application">
    <input type="reset">
</body>
</html>
