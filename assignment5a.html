<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>College Admission Application</h1>
    <form action="">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="">Full name:</label><br>
            <input type="text"><br><br>
            <label for="">Date of Birth:</label><br>
            <input type="date"><br><br>
            <label for="">Gender:</label><br>
            <input type="radio">Male <br>
            <input type="radio">Female <br>
            <input type="radio">Other <br><br>
            <label for="">Contact Number:</label><br>
            <input type="text"><br><br>
            <label for="">Email Address:</label><br>
            <input type="text"><br><br>
            <label for="">Address:</label><br>
            <textarea name="" id=""></textarea>
        </fieldset>

        <fieldset>
            <legend>Academic Background</legend>
            <label for="">High School Name:</label><br>
            <input type="text"><br><br>
            <label for="">Year of Graduation:</label><br>
            <input type="text"><br><br>
            <label for="">GPA:</label><br>
            <input type="text"><br><br>
            <label for="">Intended Major:</label><br>
            <input type="text"><br><br>
            <label for="">Extracurricular Activities:</label><br>
            <textarea name="" id=""></textarea>
        </fieldset>
        <br><br>

        <fieldset>
            <legend>Contact Details</legend>
            <label for="">Parent/Guardian Name:</label><br>
            <input type="text"><br><br>
            <label for="">Parent/Guardian Contact Number:</label><br>
            <input type="text">
        </fieldset>
        <br><br>

        <fieldset>
            <legend>Required Documents</legend>
            <label for="">Upload High School Transcript:</label><br>
            <input type="file"><br><br>
            <label for="">Upload Letter of Recommendation:</label><br>
            <input type="file"><br><br>
            <label for="">Upload Recent Photo:</label><br>
            <input type="file"><br><br>
        </fieldset>
        <br><br>

        <fieldset>
            <legend>Additional Information</legend>
            <input type="checkbox">Applying for Scholarship <br><br>
            <label for="">Do you have any special needs or accomodations?</label><br>
            <input type="radio">Yes <br>
            <input type="radio">No <br><br>
            <label for="">Additional Information:</label><br>
            <textarea name="" id=""></textarea>
        </fieldset>
        <br><br>
        <input type="submit" value="Submit Application">
        <input type="reset">
    </form>
</body>
</html>
